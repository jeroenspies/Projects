# Original image field: registry.example/report@sha256:<digest>
# Replaced with a digest-pinned busybox. Comments that were not YAML keys are kept in English.
apiVersion: batch/v1
kind: CronJob
metadata: { name: nightly-report, namespace: team-a }
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: report-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
          - name: report
            image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            volumeMounts:
            - { name: script, mountPath: /opt/script, readOnly: true }
          volumes:
          - name: script
            configMap: { name: report-script-v7 }
          restartPolicy: Never
