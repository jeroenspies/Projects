# Broad namespace Role: every verb on secrets, plus read of pods and pod logs.
# This is the unsafe ServiceAccount. It is not cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: variant-unsafe
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-broad
  namespace: variant-unsafe
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-broad
  namespace: variant-unsafe
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: variant-unsafe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-broad
