# Read-only Role. pods/log is allowed. secrets are absent: no get, list or watch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: variant-hardened
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-readonly
  namespace: variant-hardened
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-readonly
  namespace: variant-hardened
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: variant-hardened
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-readonly
