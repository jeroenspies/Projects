apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.28-alpine
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - mkdir -p /tmp/client_body /tmp/proxy /tmp/fastcgi /tmp/uwsgi /tmp/scgi && exec nginx -g 'daemon off;' -c /etc/nginx/nginx.conf
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 1
        periodSeconds: 2
        failureThreshold: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: conf
          mountPath: /usr/share/nginx/html/login.html
          subPath: login.html
          readOnly: true
        - name: tmp
          mountPath: /tmp
    - name: app
      image: docker.io/library/python:3.13-alpine
      imagePullPolicy: IfNotPresent
      command: ["python", "-u", "/opt/app.py"]
      env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: conf
          mountPath: /opt/app.py
          subPath: app.py
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: conf
      configMap:
        name: web-content
    - name: tmp
      emptyDir: {}
